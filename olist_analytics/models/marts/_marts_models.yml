version: 2

models:
  - name: fct_order_items
    tests:
      - dbt_utils.unique_combination_of_columns:
          combination_of_columns:
            - order_id
            - order_item_id
    columns:
      - name: order_id
        tests: [not_null]
      - name: customer_id
        tests: [not_null]
      - name: seller_id
        tests: [not_null]
      - name: product_id
        tests: [not_null]
      - name: seller_lat
        tests:
          - not_null:
              config:
                severity: warn
      - name: customer_lat
        tests:
          - not_null:
              config:
                severity: warn
  - name: fct_orders
    columns:
      - name: order_id
        tests: [unique, not_null]
      - name: customer_id
        tests: [not_null]
      - name: total_payment_value
        tests:
          - not_null:
              config:
                severity: warn
      - name: review_score
        tests:
          - not_null:
              config:
                severity: warn
  - name: dim_products
    columns:
      - name: product_id
        tests: [unique, not_null]
  - name: dim_sellers
    columns:
      - name: seller_id
        tests: [unique, not_null]
  - name: dim_customers
    columns:
      - name: customer_id
        tests: [unique, not_null]